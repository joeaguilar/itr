name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the release once, up front, as a DRAFT. The build matrix only
  # uploads assets: concurrent matrix jobs racing to create the same release
  # lose with a validation conflict (bit ccq's v0.1.1, where 2 of 7 uploads
  # failed).
  #
  # Draft-first closes the window where a published-but-empty release is
  # already the "latest" one (#221). GitHub excludes drafts from
  # /releases/latest, so while the matrix builds — measured at ~3 minutes on
  # v3.1.0 — that redirect still resolves to the previous COMPLETE release.
  # install.sh and install.ps1 both derive the version from it, so users
  # installing mid-build get the previous version instead of a 404.
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure draft release exists
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: true

  build:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
            apt: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install apt packages
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test native release binary
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/itr"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            BIN="${BIN}.exe"
          fi
          ./tests/integration.sh --smoke "$BIN"

      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          STAGING="itr-${{ steps.tag.outputs.name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/itr" "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM=${STAGING}.tar.gz.sha256" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = "itr-${{ steps.tag.outputs.name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/itr.exe" -Destination $staging
          Copy-Item README.md, LICENSE -Destination $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$staging.zip").Hash.ToLower()
          "$hash  $staging.zip" | Out-File -FilePath "$staging.zip.sha256" -Encoding ascii -NoNewline
          "ASSET=$staging.zip"           | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECKSUM=$staging.zip.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `draft: true` is REQUIRED here, not redundant. action-gh-release
      # documents that it carries the existing release's draft flag forward on
      # update, but it does not: on v3.1.1 the first matrix target to finish
      # published the draft (release published_at == first asset upload time),
      # putting a partial release at /releases/latest for 2.5 minutes — the
      # exact failure #221 exists to prevent. Stating the flag explicitly keeps
      # every upload a draft update, so only the publish job below can make the
      # release visible.
      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          draft: true
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          fail_on_unmatched_files: true

  # The only step that makes a release publicly resolvable. `needs: build`
  # means one failed target leaves the release an unpublished draft rather
  # than a half-populated "latest" — /releases/latest keeps pointing at the
  # last complete release until someone re-runs the workflow for this tag.
  publish:
    name: Publish Release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      # 7 build targets x (archive + .sha256). Update alongside the matrix.
      EXPECTED_ASSETS: 14
    steps:
      # Belt to the draft's braces: refuse to publish a release that is missing
      # artifacts, whatever the reason. A green matrix that somehow uploaded
      # into the wrong place fails here instead of becoming a partial "latest".
      - name: Verify every artifact landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "$TAG has $count/$EXPECTED_ASSETS assets"
          if [ "$count" -lt "$EXPECTED_ASSETS" ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
            echo "::error::Refusing to publish $TAG: $count of $EXPECTED_ASSETS assets present."
            exit 1
          fi

      - name: Publish draft and mark it latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          # --draft=false publishes; --latest sets it as the release
          # /releases/latest redirects to. Editing the draft flag alone leaves
          # the generated release notes untouched.
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          echo "Published $TAG"
